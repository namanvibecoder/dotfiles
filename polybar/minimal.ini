[bar/top]
width = 100%
height = 26
;offset-x = 20%
;offset-y = 0
;override-redirect = true
padding = 1
bottom = true
background = #1a1b26
foreground = #cdd6f4
modules-right = pulseaudio battery cpu-temp date
modules-left = i3  
;modules-center = date
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=18;3"
font-2 = "Font Awesome 5 Brands:size=10"
separator = ""
tray-position = right
tray-padding = 1
line-size = 2
tray-detached = false
;tray-offset-x = -200
[module/date]
type = internal/date
interval = 1

date = %H:%M
label = %date%

[module/text]
type = custom/text
content = "I am Awesome"

[module/wifi]
type = custom/script
exec = ~/.config/polybar/wifi-status.sh
click-right = exec ~/.config/rofi/scripts/wifi-menu.sh
interval = 10

[module/i3]
type = internal/i3

format = <label-state>

label-focused = %name%
label-focused-background = #292e42
label-focused-foreground = #c0caf5
label-focused-padding = 2
label-focused-underline = #7aa2f7

label-unfocused = %name%
label-unfocused-foreground = #565f89
label-unfocused-padding = 2

label-visible = %name%
label-visible-background = #414868
label-visible-foreground = #c0caf5
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = #f7768e
label-urgent-foreground = #1a1b26
label-urgent-padding = 2
;[module/cpu-temp]
;type = custom/script
;exec = sensors | grep 'Core 0' | awk '{print $3}'
;interval = 5 
;label = %output%
[module/cpu-temp]
type = internal/temperature
thermal-zone = 0

base-temperature = 20
warn-temperature = 90

format = <ramp> <label>
label = %temperature-c%

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 10

label-font = 1

[module/pulseaudio]
type = internal/pulseaudio

; Sink to be used, if it exists (find using `pacmd list-sinks`, name field)
; If not, uses default sink
; sink = alsa_output.pci-0000_12_00.3.analog-stereo

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
; Default: true
use-ui-max = true

; Interval for volume increase/decrease (in percent points)
; Default: 5
interval = 10

; Reverses the increment/decrement on scroll event. Set this to true if you are
; using natural scrolling option on your touchpad.
; New in version 3.7.0
; Default: false
reverse-scroll = false

; Right and Middle click
click-right = pavucontrol

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
;format-volume = <bar-volume> <label-volume>
;label-muted = -x-
;label-muted-foreground = #ffffff
label-volume = %percentage%
format-volume = <ramp-volume>  <label-volume>

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
label-muted =  muted

;bar-volume-width = 6
;bar-volume-foreground = #A6E3A1
;bar-volume-background = #313244
;bar-volume-gradient = false
;bar-volume-indicator = |
;bar-volume-fill = ━
;bar-volume-empty = ━

[module/cpu]
type = internal/cpu
interval = 2

format =  <label>
label = %percentage%%
[module/memory]
type = internal/memory
interval = 2

format = 󰍛 <label>
label = %percentage_used%%

[module/mpv]
type = custom/script
exec = ~/.config/polybar/mpv-status.sh
interval = 5
